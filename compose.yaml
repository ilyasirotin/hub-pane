services:
  web:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - no-internet
      - internet

  app:
    image: 166656354036.dkr.ecr.us-east-1.amazonaws.com/docker-images/php:8.4-fpm-xdebug3.5
    container_name: app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - no-internet
      - internet

networks:
  no-internet:
    internal: true
    driver: bridge
  internet:
    driver: bridge
